[package]
name = "pcmonitor-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rust monitoring core and Windows system inventory for PC Monitor"
license = "MIT"

[lib]
name = "pcmonitor_core"
crate-type = ["rlib"]

[[bin]]
name = "pcmonitor-native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
wmi = "0.14"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
